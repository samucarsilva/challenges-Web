<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <title> Login </title>
</head>
<body>

    <main class="main-section">

        <div class="form-container">

            <form class="form-card" action="index.html" method="POST">

                <div class="form-header">
                    <h1> Login </h1>
                </div>

                <div class="form-main">

                    <div class="form-group">
                        <input class="form-input" id="username" name="username" type="text" required>
                        <label class="form-label" for="username"> Username </label>
                        <span class="bi bi-person form-icon"> </span>
                    </div>

                    <div class="form-group">
                        <input class="form-input" id="password" name="password" type="password" required>
                        <label class="form-label" for="password"> Password </label>
                        <span class="bi bi-key form-icon"> </span>
                    </div>

                    <div class="form-options">

                        <div class="form-checkbox">
                            <input id="remember" name="remember" type="checkbox">
                            <label for="remember"> Remember Me </label>
                        </div>

                        <div>
                            <a class="form-link" href="#"> Forgot Password </a>
                        </div>

                    </div>

                    <div class="form-group">
                        <button class="form-button" type="submit" href="index.html"> Login </button>
                    </div>

                </div>

                <div class="form-footer">
                    <p> Dont have an account? </p>
                    <a class="form-link" href="#"> Register </a>
                </div>

            </form>

        </div>

    </main>

</body>
</html>
